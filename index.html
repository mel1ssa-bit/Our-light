<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Light — Local Co-op</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background:
        radial-gradient(ellipse at 25% 15%, #5a9a70 0%, transparent 45%),
        radial-gradient(ellipse at 80% 85%, #e890b8 0%, transparent 40%),
        linear-gradient(165deg, #d8f0c8 0%, #b8e0c0 40%, #f0c8e0 100%);
      font-family: "Quicksand", system-ui, sans-serif;
      color: #4a3860;
    }

    h1 { display: none; }

    .hint {
      font-size: 0.75rem;
      text-align: center;
      max-width: 640px;
      line-height: 1.4;
      color: #7a8a82;
      opacity: 0.85;
      order: 2;
    }

    canvas {
      display: block;
      border-radius: 14px;
      image-rendering: auto;
      order: 1;
      box-shadow:
        0 0 0 3px rgba(255, 170, 210, 0.4),
        0 0 0 6px rgba(120, 180, 130, 0.25),
        0 18px 40px rgba(80, 40, 80, 0.2);
    }
  </style>
</head>
<body>
  <canvas id="game" width="1000" height="600" aria-label="Our Light"></canvas>
  <p class="hint">R = character select · Pair a Bluetooth controller and press any button to connect</p>

  <script>
    /**
     * ═══════════════════════════════════════════════════════════════════════
     *  OUR LIGHT — soft-pixel co-op (split-screen)
     *  3 stages · Gamepad/Bluetooth · pink + green forest life
     * ═══════════════════════════════════════════════════════════════════════
     */

    const CANVAS_W = 1000;
    const CANVAS_H = 600;
    const VIEW_W = 500;
    const VIEW_H = 600;
    const PLAYER_RADIUS = 16;
    const ENEMY_RADIUS = 15;
    const LIGHT_RANGE = 230;
    const LIGHT_FOV = Math.PI / 2.6;
    const SWORD_RANGE = 52;
    const SWORD_DURATION = 0.2;
    const SHARED_MAX_HP = 100;
    const ENEMY_DAMAGE = 10;
    const ENEMY_TOUCH_COOLDOWN = 0.85;
    const DEADZONE = 0.28;

    // ── 3 stages (same maze layout, different living palette) ───────────────
    const STAGES = [
      {
        id: 1,
        name: "Bloom Grove",
        subtitle: "Petals & spring moss",
        floor: ["#c8ecc0", "#b4e0a8", "#9ed090"],
        grass: ["#7ecf78", "#68b868", "#a8e890"],
        wallLit: ["#8fd48a", "#6ebe68", "#52a850"],
        wallDim: ["#6aaa78", "#589868", "#487858"],
        trunk: ["#a87858", "#8a6048", "#6e4a38"],
        canopy: ["#6ecf80", "#90e0a0", "#ffb0d0", "#ffe0f0"],
        flowers: ["#ff90c0", "#ffb8d8", "#fff0a0", "#90e8b0", "#e8a0ff"],
        mist: "rgba(180, 230, 170, 0.35)",
        fog: "#2a4838",
        ambient: "#e8f8e0",
        particle: "rgba(255, 200, 230, 0.7)",
      },
      {
        id: 2,
        name: "Emerald Path",
        subtitle: "Deep green heart of the woods",
        floor: ["#98d888", "#7ec878", "#68b868"],
        grass: ["#50b060", "#3a9850", "#78d070"],
        wallLit: ["#58b868", "#40a058", "#2e8848"],
        wallDim: ["#3a8060", "#307050", "#285848"],
        trunk: ["#785840", "#5e4430", "#4a3428"],
        canopy: ["#40a858", "#58c070", "#88e098", "#c0f0c8"],
        flowers: ["#ffe080", "#ff90b0", "#a0ffc0", "#90d0ff", "#ffc090"],
        mist: "rgba(120, 200, 140, 0.4)",
        fog: "#1e4030",
        ambient: "#d0f0c8",
        particle: "rgba(180, 255, 200, 0.65)",
      },
      {
        id: 3,
        name: "Rose Dusk",
        subtitle: "Sunset meadow, soft pink light",
        floor: ["#e8d0b8", "#d8e8b0", "#c8d898"],
        grass: ["#a8c870", "#90b860", "#e8a0b8"],
        wallLit: ["#d898b0", "#b88098", "#88b878"],
        wallDim: ["#887868", "#6e6858", "#586850"],
        trunk: ["#906050", "#784838", "#603828"],
        canopy: ["#e890b8", "#f0b0d0", "#70c080", "#ffe8c0"],
        flowers: ["#ff70b0", "#ffd0e8", "#ffe8a0", "#c090ff", "#90e8c0"],
        mist: "rgba(255, 180, 210, 0.4)",
        fog: "#403040",
        ambient: "#f8e8f0",
        particle: "rgba(255, 160, 200, 0.75)",
      },
    ];

    const CHARACTERS = {
      bruxinha: {
        id: "bruxinha", name: "Bruxinha", title: "Doce das sombras",
        blurb: "Chapéu pontudo, saia plissada e um gatinho mágico no ombro.",
        skin: "#ffd4e8", blush: "#ff8ab8", hair: "#5a2a6e",
        outfit: "#c45a9a", accent: "#9b4dff", glow: "rgba(180, 100, 255, 0.55)",
      },
      mago: {
        id: "mago", name: "Mago", title: "Sábio rosado",
        blurb: "Barba fofa, manto estrelado e cajado com cristal rosa.",
        skin: "#ffe0d4", blush: "#ff9a8a", hair: "#f0e8ff",
        outfit: "#7a4aaa", accent: "#ff8ec8", glow: "rgba(255, 140, 200, 0.5)",
      },
      elfo: {
        id: "elfo", name: "Elfo", title: "Guardião do bosque",
        blurb: "Orelhas longas, arco floral e capa de folhas rosadas.",
        skin: "#ffe8f0", blush: "#ffb0c8", hair: "#3d8a5a",
        outfit: "#5aaa78", accent: "#ff9ac8", glow: "rgba(120, 220, 160, 0.45)",
      },
      fada: {
        id: "fada", name: "Fada", title: "Luz do orvalho",
        blurb: "Asas brilhantes, coroa de pétalas e poeira mágica.",
        skin: "#fff0f8", blush: "#ff90c0", hair: "#ffd060",
        outfit: "#ff7eb3", accent: "#a8e8ff", glow: "rgba(255, 200, 240, 0.65)",
      },
    };
    const CHAR_ORDER = ["bruxinha", "mago", "elfo", "fada"];

    // ── História de abertura (Raizancião) ───────────────────────────────────
    const STORY = {
      name: "Raizancião",
      title: "o Gigante das Raízes Antigas",
      pages: [
        "Ouçam bem, viajantes… Eu sou o Raizancião. Há mil invernos, abriguei esta floresta no meu peito de pedra, musgo e memória.",
        "Outrora, pétalas e luz dançavam entre as árvores. Mas a Sombra Cheia despertou — e fantasmas de capa roubaram o brilho dos bosques.",
        "Hoje, só quem carrega uma lanterna enxerga o caminho. E só quem empunha coragem pode ferir o que a escuridão esconde.",
        "Dois corações devem caminhar juntos: um para revelar, outro para proteger. Esse é o preço da luz — confiar quando um não vê o que o outro vê.",
        "Três bosques ainda clamam por socorro: o Jardim em Flor, a Trilha Esmeralda e o Crepúsculo Rosado. Derrotem os cinco fantasmas de cada um.",
        "Vocês já escolheram seu caminho. Agora entrem na floresta, acendam nossa esperança… e que a nossa luz nunca se apague.",
      ],
    };

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
    const pix = (v) => Math.round(v); // soft-pixel snap

    function pointInLightCone(px, py, ox, oy, angle, range, fov) {
      const dx = px - ox, dy = py - oy, d = Math.hypot(dx, dy);
      if (d > range) return false;
      if (d < 0.001) return true;
      let diff = Math.atan2(dy, dx) - angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      return Math.abs(diff) <= fov / 2;
    }

    function rectHitsLightCone(rect, ox, oy, angle, range, fov) {
      const s = [
        [rect.x + rect.w / 2, rect.y + rect.h / 2],
        [rect.x, rect.y], [rect.x + rect.w, rect.y],
        [rect.x, rect.y + rect.h], [rect.x + rect.w, rect.y + rect.h],
        [rect.x + rect.w / 2, rect.y], [rect.x + rect.w / 2, rect.y + rect.h],
        [rect.x, rect.y + rect.h / 2], [rect.x + rect.w, rect.y + rect.h / 2],
      ];
      return s.some(([x, y]) => pointInLightCone(x, y, ox, oy, angle, range, fov));
    }

    function circleHitsLightCone(cx, cy, r, ox, oy, angle, range, fov) {
      if (pointInLightCone(cx, cy, ox, oy, angle, range, fov)) return true;
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        if (pointInLightCone(cx + Math.cos(a) * r, cy + Math.sin(a) * r, ox, oy, angle, range, fov)) return true;
      }
      return false;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function axisDead(v) {
      return Math.abs(v) < DEADZONE ? 0 : v;
    }

    // ═══════════════════════════════════════════════════════════════════════
    //  CharacterArt (unchanged look — soft shading + accessories)
    // ═══════════════════════════════════════════════════════════════════════
    const CharacterArt = {
      draw(ctx, charId, x, y, scale, facing, time, attacking, attackProgress) {
        const c = CHARACTERS[charId];
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.beginPath();
        ctx.ellipse(0, 18, 14, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(40, 60, 40, 0.22)";
        ctx.fill();

        const aura = ctx.createRadialGradient(0, 0, 2, 0, 0, 28);
        aura.addColorStop(0, c.glow);
        aura.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, 28, 0, Math.PI * 2);
        ctx.fill();

        if (charId === "fada") this._fairyWings(ctx, time);
        if (charId === "elfo") this._elfCape(ctx);
        if (charId === "mago") this._mageRobeBack(ctx);

        this._body(ctx, c, charId);
        this._head(ctx, c, charId, facing);

        if (charId === "bruxinha") this._witchExtras(ctx, c, time);
        if (charId === "mago") this._mageExtras(ctx, c, facing);
        if (charId === "elfo") this._elfExtras(ctx, c, facing);
        if (charId === "fada") this._fairyExtras(ctx, c, time);

        ctx.beginPath();
        ctx.arc(Math.cos(facing) * 20, Math.sin(facing) * 20, 3, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 230, 250, 0.9)";
        ctx.fill();

        if (attacking) {
          const p = attackProgress || 0;
          const sweep = Math.PI * 0.95;
          const start = facing - sweep / 2 + p * 0.25;
          const end = start + sweep * Math.min(1, p * 1.35);
          ctx.beginPath();
          ctx.arc(0, 0, 30, start, end);
          ctx.strokeStyle = `rgba(255, 180, 220, ${0.95 - p * 0.55})`;
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 26, start, end);
          ctx.closePath();
          ctx.fillStyle = `rgba(255, 140, 200, ${0.28 * (1 - p)})`;
          ctx.fill();
        }
        ctx.restore();
      },

      _body(ctx, c, charId) {
        const bodyGrad = ctx.createLinearGradient(-12, -4, 12, 16);
        bodyGrad.addColorStop(0, this._lighten(c.outfit, 0.25));
        bodyGrad.addColorStop(0.45, c.outfit);
        bodyGrad.addColorStop(1, this._darken(c.outfit, 0.25));
        ctx.beginPath();
        if (charId === "fada") {
          ctx.moveTo(-6, -2); ctx.quadraticCurveTo(-16, 14, -12, 18);
          ctx.lineTo(12, 18); ctx.quadraticCurveTo(16, 14, 6, -2);
        } else if (charId === "bruxinha") {
          ctx.moveTo(-7, -2); ctx.lineTo(-14, 18); ctx.lineTo(14, 18); ctx.lineTo(7, -2);
        } else {
          ctx.moveTo(-8, -2); ctx.quadraticCurveTo(-13, 10, -10, 18);
          ctx.lineTo(10, 18); ctx.quadraticCurveTo(13, 10, 8, -2);
        }
        ctx.closePath();
        ctx.fillStyle = bodyGrad;
        ctx.fill();
        ctx.fillStyle = c.accent;
        ctx.fillRect(-9, 4, 18, 3);
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.fillRect(-9, 4, 18, 1);
      },

      _head(ctx, c, charId, facing) {
        ctx.beginPath();
        ctx.arc(0, -10, 13, 0, Math.PI * 2);
        ctx.fillStyle = c.hair;
        ctx.fill();

        const headGrad = ctx.createRadialGradient(-3, -13, 2, 0, -10, 12);
        headGrad.addColorStop(0, "#fff8fc");
        headGrad.addColorStop(0.4, c.skin);
        headGrad.addColorStop(1, this._darken(c.skin, 0.18));
        ctx.beginPath();
        ctx.arc(0, -10, 11, 0, Math.PI * 2);
        ctx.fillStyle = headGrad;
        ctx.fill();

        if (charId === "elfo") {
          ctx.fillStyle = c.skin;
          ctx.beginPath();
          ctx.moveTo(-10, -10); ctx.quadraticCurveTo(-22, -18, -12, -4); ctx.closePath(); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(10, -10); ctx.quadraticCurveTo(22, -18, 12, -4); ctx.closePath(); ctx.fill();
        }

        ctx.fillStyle = c.hair;
        ctx.beginPath();
        ctx.ellipse(0, -16, 11, 6, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        if (charId === "bruxinha") {
          ctx.beginPath();
          ctx.ellipse(-10, -6, 4, 9, 0.2, 0, Math.PI * 2);
          ctx.ellipse(10, -6, 4, 9, -0.2, 0, Math.PI * 2);
          ctx.fill();
        }
        if (charId === "fada") {
          ctx.beginPath();
          ctx.arc(-7, -18, 5, 0, Math.PI * 2);
          ctx.arc(7, -18, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = c.blush;
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.ellipse(-5.5, -8, 3.2, 2, 0, 0, Math.PI * 2);
        ctx.ellipse(5.5, -8, 3.2, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        const lookX = Math.cos(facing) * 1.2;
        ctx.fillStyle = "#3a2048";
        ctx.beginPath();
        ctx.ellipse(-3.5 + lookX, -10.5, 2.2, 2.8, 0, 0, Math.PI * 2);
        ctx.ellipse(3.5 + lookX, -10.5, 2.2, 2.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-2.8 + lookX, -11.5, 0.9, 0, Math.PI * 2);
        ctx.arc(4.2 + lookX, -11.5, 0.9, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = this._darken(c.blush, 0.2);
        ctx.lineWidth = 1.2;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, -6.5, 3, 0.15, Math.PI - 0.15);
        ctx.stroke();

        if (charId === "mago") {
          const beard = ctx.createLinearGradient(0, -4, 0, 10);
          beard.addColorStop(0, "#f8f0ff");
          beard.addColorStop(1, "#d0c0e8");
          ctx.fillStyle = beard;
          ctx.beginPath();
          ctx.moveTo(-7, -5);
          ctx.quadraticCurveTo(-9, 6, 0, 12);
          ctx.quadraticCurveTo(9, 6, 7, -5);
          ctx.quadraticCurveTo(0, -2, -7, -5);
          ctx.fill();
        }
      },

      _witchExtras(ctx, c, time) {
        const hat = ctx.createLinearGradient(-8, -40, 8, -8);
        hat.addColorStop(0, "#6b2a8a"); hat.addColorStop(0.5, "#4a1a68"); hat.addColorStop(1, "#2a0a40");
        ctx.fillStyle = hat;
        ctx.beginPath();
        ctx.moveTo(0, -42); ctx.lineTo(12, -16); ctx.lineTo(-12, -16); ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, -15, 16, 4, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#3a1558";
        ctx.fill();
        ctx.fillStyle = c.accent;
        ctx.fillRect(-8, -20, 16, 3);
        this._star(ctx, 4, -30, 3.5, "#ffd0f0");

        const bob = Math.sin(time * 3) * 1.2;
        ctx.save();
        ctx.translate(12, 2 + bob);
        ctx.fillStyle = "#2a2a38";
        ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-4, -3); ctx.lineTo(-6, -9); ctx.lineTo(-1, -5);
        ctx.moveTo(4, -3); ctx.lineTo(6, -9); ctx.lineTo(1, -5);
        ctx.fill();
        ctx.fillStyle = "#ff90c8";
        ctx.beginPath();
        ctx.arc(-1.5, -0.5, 1, 0, Math.PI * 2);
        ctx.arc(1.5, -0.5, 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      },

      _mageRobeBack(ctx) {
        ctx.fillStyle = "rgba(80, 40, 120, 0.5)";
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.quadraticCurveTo(-22, 10, -16, 22);
        ctx.lineTo(16, 22);
        ctx.quadraticCurveTo(22, 10, 10, 0);
        ctx.fill();
      },

      _mageExtras(ctx, c, facing) {
        const hat = ctx.createLinearGradient(0, -45, 0, -12);
        hat.addColorStop(0, "#c878e8"); hat.addColorStop(1, "#5a3088");
        ctx.fillStyle = hat;
        ctx.beginPath();
        ctx.moveTo(-2, -44);
        ctx.quadraticCurveTo(18, -28, 10, -14);
        ctx.lineTo(-12, -14);
        ctx.quadraticCurveTo(-8, -30, -2, -44);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, -14, 14, 3.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = "#4a2870";
        ctx.fill();
        this._star(ctx, -4, -28, 2.5, "#ffe8ff");
        this._star(ctx, 6, -22, 2, "#ffc0e8");

        const sx = Math.cos(facing + 0.4) * 18;
        const sy = Math.sin(facing + 0.4) * 18;
        ctx.strokeStyle = "#8a6040";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(sx * 0.2, sy * 0.2 + 8);
        ctx.lineTo(sx, sy - 8);
        ctx.stroke();
        const cg = ctx.createRadialGradient(sx, sy - 10, 0, sx, sy - 10, 6);
        cg.addColorStop(0, "#fff0ff"); cg.addColorStop(0.4, "#ff90d0"); cg.addColorStop(1, "#c040a0");
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.moveTo(sx, sy - 16); ctx.lineTo(sx + 5, sy - 10);
        ctx.lineTo(sx, sy - 4); ctx.lineTo(sx - 5, sy - 10);
        ctx.closePath();
        ctx.fill();
      },

      _elfCape(ctx) {
        const cape = ctx.createLinearGradient(-14, 0, 14, 20);
        cape.addColorStop(0, "#ffb0c8"); cape.addColorStop(0.5, "#e878a0"); cape.addColorStop(1, "#7aaa78");
        ctx.fillStyle = cape;
        ctx.beginPath();
        ctx.moveTo(-8, -2);
        ctx.quadraticCurveTo(-20, 8, -14, 20);
        ctx.lineTo(0, 14);
        ctx.lineTo(14, 20);
        ctx.quadraticCurveTo(20, 8, 8, -2);
        ctx.fill();
        ctx.fillStyle = "#6ecf88";
        for (const [lx, ly] of [[-10, 12], [8, 14], [-2, 16]]) {
          ctx.beginPath();
          ctx.ellipse(lx, ly, 3, 5, 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      },

      _elfExtras(ctx, c, facing) {
        ctx.fillStyle = "#5aaa70";
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.ellipse(i * 5, -20, 3.5, 5, i * 0.3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#ff90b8";
        ctx.beginPath();
        ctx.arc(-5, -21, 2, 0, Math.PI * 2);
        ctx.arc(5, -21, 2, 0, Math.PI * 2);
        ctx.arc(0, -23, 2.2, 0, Math.PI * 2);
        ctx.fill();
        const ax = Math.cos(facing - 0.5) * 16;
        const ay = Math.sin(facing - 0.5) * 16;
        ctx.strokeStyle = "#8a6048";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(ax, ay, 10, facing - 1.2, facing + 1.2);
        ctx.stroke();
        ctx.fillStyle = c.accent;
        ctx.beginPath();
        ctx.arc(ax + Math.cos(facing) * 10, ay + Math.sin(facing) * 10, 2.5, 0, Math.PI * 2);
        ctx.fill();
      },

      _fairyWings(ctx, time) {
        const flap = Math.sin(time * 8) * 0.25;
        ctx.save();
        ctx.globalAlpha = 0.55;
        const wg = ctx.createLinearGradient(-28, -10, -4, 8);
        wg.addColorStop(0, "rgba(200, 240, 255, 0.9)");
        wg.addColorStop(0.5, "rgba(255, 180, 230, 0.7)");
        wg.addColorStop(1, "rgba(255, 255, 255, 0.2)");
        ctx.save(); ctx.rotate(-0.4 + flap);
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.ellipse(-16, -4, 14, 9, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-14, 6, 10, 7, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.save(); ctx.rotate(0.4 - flap);
        ctx.fillStyle = wg;
        ctx.beginPath(); ctx.ellipse(16, -4, 14, 9, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(14, 6, 10, 7, -0.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.restore();
      },

      _fairyExtras(ctx, c, time) {
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i - 2) * 0.45;
          ctx.fillStyle = i % 2 === 0 ? "#ff90c8" : "#ffe0f0";
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * 9, -18 + Math.sin(a) * 4, 3, 5, a, 0, Math.PI * 2);
          ctx.fill();
        }
        for (let i = 0; i < 6; i++) {
          const px = Math.cos(time * 2 + i) * (18 + i * 2);
          const py = Math.sin(time * 2.5 + i * 1.3) * 12 - 4;
          ctx.fillStyle = `rgba(255, 220, 250, ${0.4 + 0.4 * Math.sin(time * 4 + i)})`;
          ctx.beginPath();
          ctx.arc(px, py, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      },

      _star(ctx, x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i * Math.PI * 2) / 5;
          const a2 = a + Math.PI / 5;
          if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          ctx.lineTo(x + Math.cos(a2) * r * 0.4, y + Math.sin(a2) * r * 0.4);
        }
        ctx.closePath();
        ctx.fill();
      },

      _lighten(hex, amt) { return this._mix(hex, "#ffffff", amt); },
      _darken(hex, amt) { return this._mix(hex, "#000000", amt); },
      _mix(a, b, t) {
        const pa = this._parse(a), pb = this._parse(b);
        return `rgb(${Math.round(pa.r+(pb.r-pa.r)*t)},${Math.round(pa.g+(pb.g-pa.g)*t)},${Math.round(pa.b+(pb.b-pa.b)*t)})`;
      },
      _parse(hex) {
        const h = hex.replace("#", "");
        return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
      },
    };

    // ═══════════════════════════════════════════════════════════════════════
    //  Raizancião — gigante ancião narrador
    // ═══════════════════════════════════════════════════════════════════════
    const StorytellerArt = {
      /** Gigante ancião amigável — estilo dos heróis, sentado no toco */
      draw(ctx, x, y, scale, time) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const bob = Math.sin(time * 1.1) * 1.5;

        // Sombra
        ctx.fillStyle = "rgba(50, 70, 50, 0.18)";
        ctx.beginPath();
        ctx.ellipse(0, 88, 55, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // Toco de árvore (assento)
        ctx.fillStyle = "#7a5848";
        ctx.fillRect(-50, 55, 100, 28);
        ctx.fillStyle = "#9a7060";
        ctx.fillRect(-50, 55, 100, 8);
        ctx.fillStyle = "#5a4038";
        ctx.fillRect(-42, 70, 84, 14);

        // Manto verde musgo (corpo arredondado)
        const robe = ctx.createLinearGradient(-40, 10, 40, 70);
        robe.addColorStop(0, "#98d8a0");
        robe.addColorStop(0.5, "#68b878");
        robe.addColorStop(1, "#489858");
        ctx.fillStyle = robe;
        ctx.beginPath();
        ctx.moveTo(-38, 20);
        ctx.quadraticCurveTo(-48, 50, -35, 68);
        ctx.lineTo(35, 68);
        ctx.quadraticCurveTo(48, 50, 38, 20);
        ctx.closePath();
        ctx.fill();

        // Braços grossos e fofos
        ctx.fillStyle = "#78c088";
        ctx.beginPath();
        ctx.ellipse(-42, 38, 14, 20, 0.4, 0, Math.PI * 2);
        ctx.ellipse(42, 38, 14, 20, -0.4, 0, Math.PI * 2);
        ctx.fill();

        // Mãos
        ctx.fillStyle = "#ffd8e8";
        ctx.beginPath();
        ctx.arc(-48, 52 + bob * 0.2, 9, 0, Math.PI * 2);
        ctx.arc(48, 52 + bob * 0.2, 9, 0, Math.PI * 2);
        ctx.fill();

        // Orbe de luz nas mãos
        const orb = ctx.createRadialGradient(0, 48, 2, 0, 48, 22);
        orb.addColorStop(0, "rgba(255, 255, 220, 0.95)");
        orb.addColorStop(0.5, "rgba(255, 200, 140, 0.6)");
        orb.addColorStop(1, "rgba(255, 160, 200, 0)");
        ctx.fillStyle = orb;
        ctx.beginPath();
        ctx.arc(0, 48 + bob * 0.2, 20 + Math.sin(time * 2) * 2, 0, Math.PI * 2);
        ctx.fill();

        // Cabeça grande e redonda
        const headGrad = ctx.createRadialGradient(-6, -28, 4, 0, -22, 32);
        headGrad.addColorStop(0, "#fff4f8");
        headGrad.addColorStop(0.5, "#ffd0e0");
        headGrad.addColorStop(1, "#e8a8c0");
        ctx.fillStyle = headGrad;
        ctx.beginPath();
        ctx.arc(0, -22 + bob * 0.3, 30, 0, Math.PI * 2);
        ctx.fill();

        // Coroa de folhas e flores
        for (let i = -2; i <= 2; i++) {
          ctx.fillStyle = i % 2 === 0 ? "#90e0a0" : "#ffb0d0";
          ctx.beginPath();
          ctx.ellipse(i * 11, -48 + bob * 0.3, 5, 7, i * 0.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // Cabelo prateado nas laterais
        ctx.fillStyle = "#d8d0e8";
        ctx.beginPath();
        ctx.ellipse(-28, -18 + bob * 0.3, 8, 14, 0.2, 0, Math.PI * 2);
        ctx.ellipse(28, -18 + bob * 0.3, 8, 14, -0.2, 0, Math.PI * 2);
        ctx.fill();

        // Sobrancelhas fofas
        ctx.strokeStyle = "#a08098";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-14, -30 + bob * 0.3);
        ctx.quadraticCurveTo(-7, -34, 0, -30);
        ctx.moveTo(0, -30 + bob * 0.3);
        ctx.quadraticCurveTo(7, -34, 14, -30);
        ctx.stroke();

        // Olhos bondosos
        ctx.fillStyle = "#4a3058";
        ctx.beginPath();
        ctx.arc(-10, -24 + bob * 0.3, 3.5, 0, Math.PI * 2);
        ctx.arc(10, -24 + bob * 0.3, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-8.5, -25.5 + bob * 0.3, 1.2, 0, Math.PI * 2);
        ctx.arc(11.5, -25.5 + bob * 0.3, 1.2, 0, Math.PI * 2);
        ctx.fill();

        // Bochechas rosadas
        ctx.fillStyle = "rgba(255, 140, 180, 0.45)";
        ctx.beginPath();
        ctx.ellipse(-16, -16 + bob * 0.3, 6, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(16, -16 + bob * 0.3, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Narizinho
        ctx.fillStyle = "#e8a0b8";
        ctx.beginPath();
        ctx.arc(0, -18 + bob * 0.3, 3, 0, Math.PI * 2);
        ctx.fill();

        // Sorriso gentil
        ctx.strokeStyle = "#b07088";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -12 + bob * 0.3, 8, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // Barba longa e fofa (branca com rosa)
        const beard = ctx.createLinearGradient(0, -8, 0, 42);
        beard.addColorStop(0, "#f8f0ff");
        beard.addColorStop(0.4, "#e8d8f0");
        beard.addColorStop(1, "#c8b0d8");
        ctx.fillStyle = beard;
        ctx.beginPath();
        ctx.moveTo(-18, -8 + bob * 0.2);
        ctx.quadraticCurveTo(-24, 18, -10, 38 + bob);
        ctx.quadraticCurveTo(0, 44 + bob, 10, 38 + bob);
        ctx.quadraticCurveTo(24, 18, 18, -8 + bob * 0.2);
        ctx.quadraticCurveTo(0, 0, -18, -8);
        ctx.fill();

        ctx.restore();
      },
    };

    // ═══════════════════════════════════════════════════════════════════════
    //  GameMap — living soft-pixel forest
    // ═══════════════════════════════════════════════════════════════════════
    class GameMap {
      constructor(stageIndex) {
        this.stageIndex = stageIndex;
        this.theme = STAGES[stageIndex];
        this.walls = [];
        this.trees = [];
        this.flowers = [];
        this.bushes = [];
        this.fireflies = [];
        this.worldW = 1680;
        this.worldH = 1260;
        this._build();
      }

      _build() {
        const W = this.worldW, H = this.worldH, T = 48;
        this.walls.push(
          { x: 0, y: 0, w: W, h: T, revelado: false },
          { x: 0, y: H - T, w: W, h: T, revelado: false },
          { x: 0, y: 0, w: T, h: H, revelado: false },
          { x: W - T, y: 0, w: T, h: H, revelado: false }
        );
        const blocks = [
          [220, 180, 40, 380], [220, 180, 340, 40], [520, 180, 40, 260],
          [360, 420, 220, 40], [740, 100, 40, 300], [740, 420, 300, 40],
          [980, 220, 40, 380], [1100, 220, 300, 40], [420, 580, 40, 300],
          [420, 580, 400, 40], [780, 580, 40, 280], [220, 820, 280, 40],
          [580, 740, 220, 40], [1140, 500, 40, 360], [1300, 660, 220, 40],
          [260, 1020, 500, 40], [900, 900, 40, 200], [1060, 900, 340, 40],
          [500, 300, 160, 40], [1420, 340, 40, 280], [640, 980, 40, 160],
          [1480, 180, 40, 200], [1200, 1100, 280, 40],
        ];
        for (const [x, y, w, h] of blocks) this.walls.push({ x, y, w, h, revelado: false });

        const treeSpots = [
          [140, 140], [300, 500], [600, 140], [880, 320], [1050, 160],
          [400, 720], [700, 860], [950, 700], [1250, 420], [1500, 700],
          [180, 980], [560, 1100], [1100, 1050], [1400, 980], [800, 520],
          [1280, 240], [340, 300], [1520, 480], [200, 600], [1600, 900],
          [480, 200], [1000, 480], [720, 1100],
        ];
        for (const [tx, ty] of treeSpots) {
          this.trees.push({
            x: pix(tx), y: pix(ty),
            trunkH: 24 + ((tx + ty) % 5) * 4,
            size: 3 + ((tx * 3 + ty) % 3),
          });
        }

        for (let i = 0; i < 100; i++) {
          this.flowers.push({
            x: 60 + ((i * 137) % (W - 120)),
            y: 60 + ((i * 89) % (H - 120)),
            color: this.theme.flowers[i % this.theme.flowers.length],
            size: 2 + (i % 3),
          });
        }

        for (let i = 0; i < 35; i++) {
          this.bushes.push({
            x: 80 + ((i * 211) % (W - 160)),
            y: 80 + ((i * 173) % (H - 160)),
            w: 18 + (i % 4) * 6,
          });
        }

        for (let i = 0; i < 45; i++) {
          this.fireflies.push({
            x: Math.random() * W, y: Math.random() * H,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 0.8,
          });
        }
      }

      resetRevelation() {
        for (const wall of this.walls) wall.revelado = false;
      }

      resolveCircleCollision(x, y, radius) {
        let nx = x, ny = y;
        for (const wall of this.walls) {
          const closestX = clamp(nx, wall.x, wall.x + wall.w);
          const closestY = clamp(ny, wall.y, wall.y + wall.h);
          const dx = nx - closestX, dy = ny - closestY, d2 = dx * dx + dy * dy;
          if (d2 < radius * radius) {
            if (d2 === 0) {
              const left = nx - wall.x, right = wall.x + wall.w - nx;
              const top = ny - wall.y, bottom = wall.y + wall.h - ny;
              const min = Math.min(left, right, top, bottom);
              if (min === left) nx = wall.x - radius;
              else if (min === right) nx = wall.x + wall.w + radius;
              else if (min === top) ny = wall.y - radius;
              else ny = wall.y + wall.h + radius;
            } else {
              const d = Math.sqrt(d2), push = (radius - d) / d;
              nx += dx * push; ny += dy * push;
            }
          }
        }
        return {
          x: clamp(nx, radius, this.worldW - radius),
          y: clamp(ny, radius, this.worldH - radius),
        };
      }

      updateFireflies(dt) {
        for (const f of this.fireflies) {
          f.phase += dt * f.speed;
          f.x += Math.cos(f.phase) * 12 * dt;
          f.y += Math.sin(f.phase * 0.7) * 10 * dt;
        }
      }

      /** Soft checkered grass floor — no black void */
      drawFloor(ctx, cam, viewW, viewH) {
        const th = this.theme;
        const tile = 32;
        const x0 = Math.floor(cam.x / tile) * tile;
        const y0 = Math.floor(cam.y / tile) * tile;

        for (let y = y0; y < cam.y + viewH + tile; y += tile) {
          for (let x = x0; x < cam.x + viewW + tile; x += tile) {
            const ix = ((x / tile) | 0) + ((y / tile) | 0);
            ctx.fillStyle = th.floor[ix % 3];
            ctx.fillRect(pix(x), pix(y), tile, tile);
            // soft pixel speckles
            if (ix % 5 === 0) {
              ctx.fillStyle = th.grass[ix % 3];
              ctx.fillRect(pix(x) + 8, pix(y) + 10, 4, 4);
              ctx.fillRect(pix(x) + 20, pix(y) + 18, 3, 3);
            }
          }
        }

        // soft light wash
        const wash = ctx.createRadialGradient(
          cam.x + viewW / 2, cam.y + viewH / 2, 40,
          cam.x + viewW / 2, cam.y + viewH / 2, viewW * 0.7
        );
        wash.addColorStop(0, "rgba(255,255,255,0.08)");
        wash.addColorStop(1, th.mist);
        ctx.fillStyle = wash;
        ctx.fillRect(cam.x, cam.y, viewW, viewH);
      }

      drawDecor(ctx, onlyRevealed, time) {
        const th = this.theme;

        // Bushes (soft pixel blobs)
        for (const b of this.bushes) {
          if (onlyRevealed) continue;
          const bx = pix(b.x), by = pix(b.y);
          ctx.fillStyle = th.grass[0];
          ctx.fillRect(bx, by, b.w, 12);
          ctx.fillStyle = th.grass[1];
          ctx.fillRect(bx + 4, by - 6, b.w - 8, 10);
          ctx.fillStyle = th.canopy[1];
          ctx.fillRect(bx + 8, by - 10, Math.max(6, b.w - 14), 8);
        }

        // Flowers
        for (const fl of this.flowers) {
          if (onlyRevealed) continue;
          const fx = pix(fl.x), fy = pix(fl.y);
          ctx.fillStyle = th.grass[2];
          ctx.fillRect(fx, fy, 2, 5);
          ctx.fillStyle = fl.color;
          ctx.fillRect(fx - fl.size, fy - fl.size, fl.size * 2, fl.size * 2);
          ctx.fillStyle = "#fff6c0";
          ctx.fillRect(fx, fy, 2, 2);
        }

        // Soft-pixel trees
        for (const t of this.trees) {
          this._drawSoftPixelTree(ctx, t, th);
        }

        // Fireflies / pollen
        if (!onlyRevealed) {
          for (const f of this.fireflies) {
            const pulse = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(time * 3 + f.phase));
            const fx = pix(f.x), fy = pix(f.y);
            ctx.fillStyle = th.particle.replace(/[\d.]+\)$/, `${pulse})`);
            ctx.fillRect(fx - 1, fy - 1, 3, 3);
            ctx.globalAlpha = pulse * 0.35;
            ctx.fillRect(fx - 3, fy - 3, 7, 7);
            ctx.globalAlpha = 1;
          }
        }
      }

      _drawSoftPixelTree(ctx, t, th) {
        const x = pix(t.x), y = pix(t.y);
        const s = t.size;
        // trunk
        ctx.fillStyle = th.trunk[1];
        ctx.fillRect(x - 3, y - t.trunkH, 7, t.trunkH);
        ctx.fillStyle = th.trunk[0];
        ctx.fillRect(x - 3, y - t.trunkH, 3, t.trunkH);
        ctx.fillStyle = th.trunk[2];
        ctx.fillRect(x + 2, y - t.trunkH, 2, t.trunkH);

        // canopy blocks (soft pixel, layered)
        const cy = y - t.trunkH - 4;
        const layers = [
          { ox: 0, oy: 0, w: 10 + s * 4, h: 8 + s * 2, c: th.canopy[0] },
          { ox: -6, oy: -6, w: 8 + s * 3, h: 7 + s, c: th.canopy[1] },
          { ox: 4, oy: -8, w: 8 + s * 2, h: 7 + s, c: th.canopy[2] },
          { ox: -2, oy: -14, w: 7 + s * 2, h: 6 + s, c: th.canopy[3] },
        ];
        for (const L of layers) {
          ctx.fillStyle = L.c;
          ctx.fillRect(x - L.w / 2 + L.ox, cy + L.oy, L.w, L.h);
        }
        // highlight
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        ctx.fillRect(x - 4, cy - 12, 5, 4);
      }

      drawWalls(ctx, onlyRevealed) {
        const th = this.theme;
        for (const wall of this.walls) {
          if (onlyRevealed && !wall.revelado) continue;
          const cols = wall.revelado ? th.wallLit : th.wallDim;
          ctx.fillStyle = cols[1];
          ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
          // soft pixel edge
          ctx.fillStyle = cols[0];
          ctx.fillRect(wall.x, wall.y, wall.w, 4);
          ctx.fillRect(wall.x, wall.y, 4, wall.h);
          ctx.fillStyle = cols[2];
          ctx.fillRect(wall.x, wall.y + wall.h - 4, wall.w, 4);
          ctx.fillRect(wall.x + wall.w - 4, wall.y, 4, wall.h);
          // leaf pixels on hedges
          ctx.fillStyle = wall.revelado ? "rgba(255,200,230,0.35)" : "rgba(100,180,120,0.25)";
          for (let i = 0; i < 4; i++) {
            const lx = wall.x + 6 + ((i * 41) % Math.max(8, wall.w - 12));
            const ly = wall.y + 6 + ((i * 27) % Math.max(8, wall.h - 12));
            ctx.fillRect(lx, ly, 5, 5);
          }
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    class Player {
      constructor({ x, y, role, charId, speed }) {
        this.x = x; this.y = y; this.role = role; this.charId = charId;
        this.speed = speed; this.radius = PLAYER_RADIUS; this.facing = 0;
        this.attacking = false; this.attackTimer = 0; this.attackCooldown = 0;
      }

      move(ix, iy, dt, map) {
        const len = Math.hypot(ix, iy);
        if (len > 0) {
          ix /= len; iy /= len;
          this.x += ix * this.speed * dt;
          this.y += iy * this.speed * dt;
          if (this.role === "warrior" && !this.attacking) this.facing = Math.atan2(iy, ix);
        }
        const r = map.resolveCircleCollision(this.x, this.y, this.radius);
        this.x = r.x; this.y = r.y;
      }

      tryAttack() {
        if (this.role !== "warrior") return;
        if (this.attackCooldown > 0 || this.attacking) return;
        this.attacking = true;
        this.attackTimer = SWORD_DURATION;
        this.attackCooldown = 0.45;
      }

      updateCombat(dt) {
        if (this.attackCooldown > 0) this.attackCooldown -= dt;
        if (this.attacking) {
          this.attackTimer -= dt;
          if (this.attackTimer <= 0) { this.attacking = false; this.attackTimer = 0; }
        }
      }

      get attackProgress() {
        return this.attacking ? 1 - this.attackTimer / SWORD_DURATION : 0;
      }

      draw(ctx, time) {
        CharacterArt.draw(ctx, this.charId, this.x, this.y, 1, this.facing, time, this.attacking, this.attackProgress);
      }

      drawLightCone(ctx) {
        if (this.role !== "lantern") return;
        const half = LIGHT_FOV / 2, a0 = this.facing - half, a1 = this.facing + half;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        for (let i = 0; i <= 18; i++) {
          const a = a0 + (a1 - a0) * (i / 18);
          ctx.lineTo(this.x + Math.cos(a) * LIGHT_RANGE, this.y + Math.sin(a) * LIGHT_RANGE);
        }
        ctx.closePath();
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, LIGHT_RANGE);
        grad.addColorStop(0, "rgba(255, 240, 220, 0.48)");
        grad.addColorStop(0.4, "rgba(255, 200, 160, 0.2)");
        grad.addColorStop(1, "rgba(255, 180, 120, 0)");
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    class Enemy {
      constructor(x, y) {
        this.x = x; this.y = y; this.radius = ENEMY_RADIUS; this.speed = 52;
        this.revelado = false; this.alive = true; this.touchCooldown = 0;
        this.phase = Math.random() * Math.PI * 2;
      }

      update(dt, target, map) {
        if (!this.alive) return;
        if (this.touchCooldown > 0) this.touchCooldown -= dt;
        this.phase += dt * 2.5;
        const dx = target.x - this.x, dy = target.y - this.y, d = Math.hypot(dx, dy);
        if (d > 1) {
          this.x += (dx / d) * this.speed * dt;
          this.y += (dy / d) * this.speed * dt;
        }
        this.y += Math.sin(this.phase) * 8 * dt;
        const r = map.resolveCircleCollision(this.x, this.y, this.radius);
        this.x = r.x; this.y = r.y;
      }

      tryHitBySword(warrior) {
        if (!this.alive || !this.revelado || !warrior.attacking) return false;
        if (dist(this.x, this.y, warrior.x, warrior.y) > SWORD_RANGE + this.radius) return false;
        let diff = Math.atan2(this.y - warrior.y, this.x - warrior.x) - warrior.facing;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) > Math.PI * 0.55) return false;
        this.alive = false;
        return true;
      }

      draw(ctx, time) {
        if (!this.alive || !this.revelado) return;
        const bob = Math.sin(time * 3 + this.phase) * 3;
        ctx.save();
        ctx.translate(this.x, this.y + bob);

        ctx.fillStyle = "rgba(60, 20, 50, 0.3)";
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();

        // soft-pixel cape
        ctx.fillStyle = "#1a1a24";
        ctx.beginPath();
        ctx.moveTo(-12, -4);
        ctx.quadraticCurveTo(-22, 8, -16, 22 + Math.sin(time * 4) * 3);
        ctx.quadraticCurveTo(-6, 16, 0, 20);
        ctx.quadraticCurveTo(6, 16, 16, 22 + Math.cos(time * 4) * 3);
        ctx.quadraticCurveTo(22, 8, 12, -4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#12121a";
        ctx.beginPath();
        ctx.arc(0, -4, 12, Math.PI, 0);
        ctx.quadraticCurveTo(14, 8, 0, 14);
        ctx.quadraticCurveTo(-14, 8, -12, -4);
        ctx.fill();

        ctx.fillStyle = "#0a0a10";
        ctx.beginPath();
        ctx.ellipse(0, -2, 7, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        const eyeGlow = 0.7 + 0.3 * Math.sin(time * 5 + this.phase);
        ctx.fillStyle = `rgba(255, 80, 140, ${eyeGlow})`;
        ctx.fillRect(-5, -5, 4, 5);
        ctx.fillRect(2, -5, 4, 5);
        ctx.fillStyle = "#1a0010";
        ctx.fillRect(-3, -3, 2, 2);
        ctx.fillRect(3, -3, 2, 2);

        ctx.restore();
      }
    }

    // ═══════════════════════════════════════════════════════════════════════
    class Game {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.keys = Object.create(null);
        this.mouse = { x: VIEW_W / 2, y: VIEW_H / 2 };
        this.state = "select";
        this.time = 0;
        this.stageIndex = 0;
        this.phaseAnnounce = 0;

        // Intro narrativa (depois da seleção)
        this.storyPage = 0;
        this.storyChars = 0;
        this.introFade = 0;
        this.introExit = 0;
        this._introCanAdvance = false;
        this._introAdvanceLock = 0;

        this.selectP1 = 0;
        this.selectP2 = 1;
        this.readyP1 = false;
        this.readyP2 = false;

        // Gamepad edge triggers
        this._padPrev = [{}, {}];
        this.padsConnected = 0;

        this._bindInput();
        this._lastTime = performance.now();
        this.loop = this.loop.bind(this);
      }

      _beginIntro() {
        this.state = "intro";
        this.storyPage = 0;
        this.storyChars = 0;
        this.introFade = 0;
        this.introExit = 0;
        this._introCanAdvance = false;
        this._introAdvanceLock = 0.5;
      }

      startMatch() {
        this.stageIndex = 0;
        this._spawnStage(true);
        this.state = "play";
      }

      _spawnStage(fullReset) {
        const id1 = CHAR_ORDER[this.selectP1];
        const id2 = CHAR_ORDER[this.selectP2];
        this.map = new GameMap(this.stageIndex);

        if (fullReset || !this.player1) {
          this.player1 = new Player({ x: 130, y: 130, role: "lantern", charId: id1, speed: 158 });
          this.player2 = new Player({ x: 190, y: 130, role: "warrior", charId: id2, speed: 148 });
          this.sharedHp = SHARED_MAX_HP;
        } else {
          this.player1.x = 130; this.player1.y = 130;
          this.player2.x = 190; this.player2.y = 130;
          this.sharedHp = Math.min(SHARED_MAX_HP, this.sharedHp + 25);
        }

        this.enemies = [
          new Enemy(480, 320), new Enemy(880, 280), new Enemy(620, 720),
          new Enemy(1320, 520), new Enemy(1020, 1020),
        ];
        this.enemiesDefeated = 0;
        this.totalEnemies = this.enemies.length;
        this.gameOver = false;
        this.victory = false;
        this._stageClearArmed = false;
        this._stageClearTimer = 0;
        this.phaseAnnounce = 2.2;
      }

      nextStage() {
        if (this.stageIndex >= STAGES.length - 1) {
          this.victory = true;
          this.state = "victory";
          return;
        }
        this.stageIndex += 1;
        this._spawnStage(false);
      }

      backToSelect() {
        this.state = "select";
        this.readyP1 = false;
        this.readyP2 = false;
        this.gameOver = false;
        this.victory = false;
      }

      _bindInput() {
        window.addEventListener("keydown", (e) => {
          this.keys[e.code] = true;
          if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();

          if (this.state === "intro") {
            if (["Enter", "Space", "KeyW", "ArrowUp", "KeyD", "ArrowRight"].includes(e.code)) {
              this._tryAdvanceStory();
            }
            return;
          }

          if (this.state === "select") {
            this._handleSelectKey(e.code);
            return;
          }
          if (e.code === "Space" && this.state === "play" && !this.gameOver) this.player2.tryAttack();
          if (e.code === "KeyR") this.backToSelect();
          if (e.code === "Enter" && (this.state === "victory" || this.state === "gameover")) this.backToSelect();
        });
        window.addEventListener("keyup", (e) => { this.keys[e.code] = false; });

        this.canvas.addEventListener("mousemove", (e) => {
          const rect = this.canvas.getBoundingClientRect();
          this.mouse.x = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          this.mouse.y = (e.clientY - rect.top) * (this.canvas.height / rect.height);
        });

        this.canvas.addEventListener("click", (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const mx = (e.clientX - rect.left) * (this.canvas.width / rect.width);
          const my = (e.clientY - rect.top) * (this.canvas.height / rect.height);

          if (this.state === "intro") {
            this._tryAdvanceStory();
            return;
          }
          if (this.state !== "select") return;
          this._handleSelectClick(mx, my);
        });

        window.addEventListener("gamepadconnected", () => {});
        window.addEventListener("gamepaddisconnected", () => {});
      }

      /** Poll Bluetooth / USB gamepads via Gamepad API */
      _pollPads() {
        const list = navigator.getGamepads ? navigator.getGamepads() : [];
        const pads = [];
        for (let i = 0; i < list.length; i++) if (list[i]) pads.push(list[i]);
        this.padsConnected = pads.length;
        this.pad1 = pads[0] || null;
        this.pad2 = pads[1] || pads[0] || null; // 1 pad can drive P2 buttons if alone? Better: pad0=P1, pad1=P2
        if (pads.length === 1) {
          this.pad1 = pads[0];
          this.pad2 = null; // single pad → P1 only; keyboard for P2
        }
        return pads;
      }

      _padPressed(padIndex, buttonIndex) {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        const active = [];
        for (let i = 0; i < pads.length; i++) if (pads[i]) active.push(pads[i]);
        const pad = active[padIndex];
        if (!pad || !pad.buttons[buttonIndex]) return false;
        const pressed = pad.buttons[buttonIndex].pressed;
        const key = padIndex + ":" + buttonIndex;
        const was = this._padPrev[padIndex] && this._padPrev[padIndex][buttonIndex];
        if (!this._padPrev[padIndex]) this._padPrev[padIndex] = {};
        this._padPrev[padIndex][buttonIndex] = pressed;
        return pressed && !was;
      }

      _tryAdvanceStory() {
        if (!this._introCanAdvance || this._introAdvanceLock > 0) return;
        this._introAdvanceLock = 0.35;

        if (this.storyPage < STORY.pages.length - 1) {
          this.storyPage += 1;
          this.storyChars = 0;
          this._introCanAdvance = false;
        } else {
          this.introExit = 1;
        }
      }

      _finishIntro() {
        this.startMatch();
      }

      _updateIntro(dt) {
        if (this.introExit > 0) {
          this.introExit -= dt * 1.2;
          if (this.introExit <= 0) this._finishIntro();
          return;
        }

        if (this.introFade < 1) this.introFade = Math.min(1, this.introFade + dt * 0.6);

        const page = STORY.pages[this.storyPage];
        if (this.storyChars < page.length) {
          this.storyChars = Math.min(page.length, this.storyChars + dt * 38);
        } else {
          this._introCanAdvance = true;
        }

        if (this._introAdvanceLock > 0) this._introAdvanceLock -= dt;
      }

      _drawIntroScreen() {
        const ctx = this.ctx;
        const fade = this.introExit > 0 ? clamp(this.introExit, 0, 1) : this.introFade;

        // Céu mágico
        const sky = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        sky.addColorStop(0, "#2a3850");
        sky.addColorStop(0.4, "#6888a0");
        sky.addColorStop(0.75, "#98c8a0");
        sky.addColorStop(1, "#d0f0c8");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Estrelas suaves
        for (let i = 0; i < 30; i++) {
          const sx = (i * 137) % CANVAS_W;
          const sy = (i * 71) % 180;
          ctx.globalAlpha = (0.3 + 0.4 * Math.sin(this.time * 2 + i)) * fade;
          ctx.fillStyle = i % 2 === 0 ? "#ffe8c0" : "#d0f0ff";
          ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.globalAlpha = 1;

        // Chão
        ctx.fillStyle = `rgba(100, 150, 100, ${0.5 * fade})`;
        ctx.fillRect(0, 500, CANVAS_W, 100);

        // Título
        ctx.textAlign = "center";
        ctx.font = "700 26px Cormorant Garamond, serif";
        ctx.fillStyle = `rgba(255, 230, 245, ${0.9 * fade})`;
        ctx.fillText("Our Light", CANVAS_W / 2, 36);

        // Heróis escolhidos (pequenos, no topo)
        const p1n = CHARACTERS[CHAR_ORDER[this.selectP1]].name;
        const p2n = CHARACTERS[CHAR_ORDER[this.selectP2]].name;
        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = `rgba(220, 240, 220, ${0.85 * fade})`;
        ctx.fillText(`${p1n} & ${p2n} · ouçam a lenda…`, CANVAS_W / 2, 56);

        // Painel do pergaminho (lado direito, texto alinhado)
        const scrollX = 300, scrollY = 78, scrollW = 660, scrollH = 400;
        roundRect(ctx, scrollX, scrollY, scrollW, scrollH, 18);
        const scrollG = ctx.createLinearGradient(scrollX, scrollY, scrollX, scrollY + scrollH);
        scrollG.addColorStop(0, "rgba(255, 252, 248, 0.97)");
        scrollG.addColorStop(1, "rgba(235, 248, 235, 0.95)");
        ctx.fillStyle = scrollG;
        ctx.fill();
        ctx.strokeStyle = "rgba(160, 190, 160, 0.55)";
        ctx.lineWidth = 2;
        roundRect(ctx, scrollX, scrollY, scrollW, scrollH, 18);
        ctx.stroke();

        const pad = 32;
        const textX = scrollX + pad;
        const textW = scrollW - pad * 2;

        // Nome do narrador
        ctx.textAlign = "left";
        ctx.font = "700 24px Cormorant Garamond, serif";
        ctx.fillStyle = "#7a5870";
        ctx.fillText(STORY.name, textX, scrollY + 40);
        ctx.font = "600 12px Quicksand, sans-serif";
        ctx.fillStyle = "#8a7888";
        ctx.fillText(STORY.title, textX, scrollY + 58);

        ctx.strokeStyle = "rgba(200, 170, 190, 0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(textX, scrollY + 68);
        ctx.lineTo(scrollX + scrollW - pad, scrollY + 68);
        ctx.stroke();

        // Texto alinhado à esquerda
        const pageText = STORY.pages[this.storyPage].slice(0, Math.floor(this.storyChars));
        ctx.font = "500 16px Quicksand, sans-serif";
        ctx.fillStyle = "#4a4048";
        this._wrapTextLeft(ctx, pageText, textX, scrollY + 96, textW, 26);

        // Página
        ctx.textAlign = "right";
        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = "#a098a0";
        ctx.fillText(
          `${this.storyPage + 1} / ${STORY.pages.length}`,
          scrollX + scrollW - pad,
          scrollY + scrollH - 20
        );

        // Gigante à esquerda do painel
        ctx.globalAlpha = fade;
        StorytellerArt.draw(ctx, 155, 490, 2.0, this.time);
        ctx.globalAlpha = 1;

        // Prompt
        if (this._introCanAdvance && this.introExit <= 0) {
          const pulse = 0.5 + 0.5 * Math.sin(this.time * 4);
          ctx.textAlign = "center";
          ctx.globalAlpha = 0.55 + pulse * 0.45;
          ctx.font = "600 13px Quicksand, sans-serif";
          ctx.fillStyle = "#e8f8e8";
          const prompt = this.storyPage < STORY.pages.length - 1
            ? "Espaço ou clique para continuar…"
            : "Espaço ou clique para começar a aventura…";
          ctx.fillText(prompt, CANVAS_W / 2, CANVAS_H - 28);
          ctx.globalAlpha = 1;
        }

        ctx.textAlign = "left";
      }

      _handleSelectKey(code) {
        if (code === "KeyA") { this.selectP1 = (this.selectP1 + 3) % 4; this.readyP1 = false; }
        if (code === "KeyD") { this.selectP1 = (this.selectP1 + 1) % 4; this.readyP1 = false; }
        if (code === "KeyW" || code === "KeyS") this.readyP1 = !this.readyP1;

        if (code === "ArrowLeft") { this.selectP2 = (this.selectP2 + 3) % 4; this.readyP2 = false; }
        if (code === "ArrowRight") { this.selectP2 = (this.selectP2 + 1) % 4; this.readyP2 = false; }
        if (code === "Space" || code === "ArrowUp" || code === "ArrowDown") this.readyP2 = !this.readyP2;

        if (code === "Enter" && this.readyP1 && this.readyP2) this._beginIntro();
      }

      _handleSelectPad() {
        // P1 pad: d-pad / stick left-right, A (0) confirm
        if (this._padPressed(0, 14) || (this.pad1 && axisDead(this.pad1.axes[0]) < -0.6 && this._padAxisEdge(0, 0, -1))) {
          this.selectP1 = (this.selectP1 + 3) % 4; this.readyP1 = false;
        }
        if (this._padPressed(0, 15) || (this.pad1 && axisDead(this.pad1.axes[0]) > 0.6 && this._padAxisEdge(0, 0, 1))) {
          this.selectP1 = (this.selectP1 + 1) % 4; this.readyP1 = false;
        }
        if (this._padPressed(0, 0)) this.readyP1 = !this.readyP1;

        // P2 pad
        if (this._padPressed(1, 14)) { this.selectP2 = (this.selectP2 + 3) % 4; this.readyP2 = false; }
        if (this._padPressed(1, 15)) { this.selectP2 = (this.selectP2 + 1) % 4; this.readyP2 = false; }
        if (this._padPressed(1, 0)) this.readyP2 = !this.readyP2;

        if (this._padPressed(0, 9) || this._padPressed(1, 9)) {
          if (this.readyP1 && this.readyP2) this._beginIntro();
        }
      }

      _padAxisEdge(padIndex, axis, dir) {
        // simple repeat throttle via time
        const k = `a${padIndex}_${axis}_${dir}`;
        if (!this._axisCool) this._axisCool = {};
        if ((this._axisCool[k] || 0) > this.time) return false;
        this._axisCool[k] = this.time + 0.25;
        return true;
      }

      _handleSelectClick(mx, my) {
        const cards = this._selectCardLayout();
        for (let i = 0; i < cards.length; i++) {
          const c = cards[i];
          if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) {
            if (mx < CANVAS_W / 2) { this.selectP1 = i; this.readyP1 = true; }
            else { this.selectP2 = i; this.readyP2 = true; }
          }
        }
        const btn = this._startButtonRect();
        if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h && this.readyP1 && this.readyP2) {
          this._beginIntro();
        }
      }

      _selectCardLayout() {
        const cardW = 200, cardH = 248, gap = 22;
        const total = 4 * cardW + 3 * gap;
        const startX = (CANVAS_W - total) / 2;
        const y = 168; // abaixo das instruções + status P1/P2
        return CHAR_ORDER.map((id, i) => ({
          x: startX + i * (cardW + gap), y, w: cardW, h: cardH, id,
        }));
      }

      /** Botão abaixo dos cards, texto centralizado no hitbox */
      _startButtonRect() {
        return { x: CANVAS_W / 2 - 130, y: 432, w: 260, h: 46 };
      }

      update(dt) {
        this.time += dt;
        this._pollPads();

        if (this.state === "intro") {
          this._updateIntro(dt);
          if (this._padPressed(0, 0) || this._padPressed(1, 0)) this._tryAdvanceStory();
          return;
        }

        if (this.state === "select") {
          this._handleSelectPad();
          return;
        }
        if (this.state === "gameover" || this.state === "victory") return;

        if (this.phaseAnnounce > 0) this.phaseAnnounce -= dt;

        // Movement merge: keyboard + gamepad
        let p1x = 0, p1y = 0;
        if (this.keys["KeyW"]) p1y -= 1;
        if (this.keys["KeyS"]) p1y += 1;
        if (this.keys["KeyA"]) p1x -= 1;
        if (this.keys["KeyD"]) p1x += 1;
        if (this.pad1) {
          p1x += axisDead(this.pad1.axes[0] || 0);
          p1y += axisDead(this.pad1.axes[1] || 0);
          // right stick aims lantern
          const rx = axisDead(this.pad1.axes[2] || 0);
          const ry = axisDead(this.pad1.axes[3] || 0);
          if (Math.hypot(rx, ry) > 0.2) this.player1.facing = Math.atan2(ry, rx);
        }
        this.player1.move(p1x, p1y, dt, this.map);

        let p2x = 0, p2y = 0;
        if (this.keys["ArrowUp"]) p2y -= 1;
        if (this.keys["ArrowDown"]) p2y += 1;
        if (this.keys["ArrowLeft"]) p2x -= 1;
        if (this.keys["ArrowRight"]) p2x += 1;
        if (this.pad2) {
          p2x += axisDead(this.pad2.axes[0] || 0);
          p2y += axisDead(this.pad2.axes[1] || 0);
          if (this._padPressed(1, 0) || this._padPressed(1, 2)) this.player2.tryAttack();
        }
        // If only one pad and it's pad1, allow bumper on pad1 for P2 attack when sharing? skip
        this.player2.move(p2x, p2y, dt, this.map);
        this.player2.updateCombat(dt);

        if (!this.pad1 || Math.hypot(axisDead(this.pad1.axes[2]||0), axisDead(this.pad1.axes[3]||0)) <= 0.2) {
          this._updateLanternFacing();
        }

        this.map.updateFireflies(dt);

        this.map.resetRevelation();
        for (const e of this.enemies) if (e.alive) e.revelado = false;

        const p1 = this.player1;
        for (const wall of this.map.walls) {
          if (rectHitsLightCone(wall, p1.x, p1.y, p1.facing, LIGHT_RANGE, LIGHT_FOV)) wall.revelado = true;
        }
        for (const enemy of this.enemies) {
          if (!enemy.alive) continue;
          if (circleHitsLightCone(enemy.x, enemy.y, enemy.radius, p1.x, p1.y, p1.facing, LIGHT_RANGE, LIGHT_FOV)) {
            enemy.revelado = true;
          }
        }

        for (const enemy of this.enemies) {
          enemy.update(dt, this.player2, this.map);
          if (enemy.tryHitBySword(this.player2)) this.enemiesDefeated += 1;

          if (
            enemy.alive && enemy.touchCooldown <= 0 &&
            dist(enemy.x, enemy.y, this.player2.x, this.player2.y) < enemy.radius + this.player2.radius
          ) {
            this.sharedHp = Math.max(0, this.sharedHp - ENEMY_DAMAGE);
            enemy.touchCooldown = ENEMY_TOUCH_COOLDOWN;
            const ang = Math.atan2(this.player2.y - enemy.y, this.player2.x - enemy.x);
            this.player2.x += Math.cos(ang) * 18;
            this.player2.y += Math.sin(ang) * 18;
            const fixed = this.map.resolveCircleCollision(this.player2.x, this.player2.y, this.player2.radius);
            this.player2.x = fixed.x; this.player2.y = fixed.y;
          }
        }

        if (this.sharedHp <= 0) {
          this.gameOver = true;
          this.state = "gameover";
        }

        // Clear stage → next environment
        if (this.enemiesDefeated >= this.totalEnemies && this.enemies.every((e) => !e.alive)) {
          if (!this._stageClearArmed) {
            this._stageClearArmed = true;
            this._stageClearTimer = 1.4;
          }
        }
        if (this._stageClearArmed) {
          this._stageClearTimer -= dt;
          if (this._stageClearTimer <= 0) {
            this._stageClearArmed = false;
            this.nextStage();
          }
        }
      }

      _updateLanternFacing() {
        const cam = this._cameraFor(this.player1);
        const worldX = clamp(this.mouse.x, 0, VIEW_W) + cam.x;
        const worldY = clamp(this.mouse.y, 0, VIEW_H) + cam.y;
        this.player1.facing = Math.atan2(worldY - this.player1.y, worldX - this.player1.x);
      }

      _cameraFor(player) {
        return {
          x: clamp(player.x - VIEW_W / 2, 0, Math.max(0, this.map.worldW - VIEW_W)),
          y: clamp(player.y - VIEW_H / 2, 0, Math.max(0, this.map.worldH - VIEW_H)),
        };
      }

      draw() {
        const ctx = this.ctx;
        if (this.state === "intro") { this._drawIntroScreen(); return; }
        if (this.state === "select") { this._drawSelectScreen(); return; }

        const th = this.map.theme;
        ctx.fillStyle = th.ambient;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        this._drawViewport({ offsetX: 0, player: this.player1, showLight: true, onlyRevealed: false, fogForWarrior: false });
        this._drawViewport({ offsetX: VIEW_W, player: this.player2, showLight: false, onlyRevealed: true, fogForWarrior: true });

        // Soft divider
        ctx.fillStyle = "rgba(255, 180, 210, 0.55)";
        ctx.fillRect(VIEW_W - 2, 0, 4, CANVAS_H);
        ctx.fillStyle = "rgba(120, 180, 130, 0.45)";
        ctx.fillRect(VIEW_W - 1, 0, 2, CANVAS_H);

        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = "rgba(80, 60, 100, 0.8)";
        ctx.fillText("P1 · LIGHT · " + CHARACTERS[this.player1.charId].name, 12, CANVAS_H - 14);
        ctx.fillText("P2 · SWORD · " + CHARACTERS[this.player2.charId].name, VIEW_W + 12, CANVAS_H - 14);

        this._drawUI();

        if (this.phaseAnnounce > 0) this._drawPhaseBanner();
        if (this._stageClearArmed) this._drawStageClear();
        if (this.state === "gameover") this._drawGameOver();
        if (this.state === "victory") this._drawVictory();
      }

      _drawViewport({ offsetX, player, showLight, onlyRevealed, fogForWarrior }) {
        const ctx = this.ctx;
        const cam = this._cameraFor(player);
        const th = this.map.theme;

        ctx.save();
        ctx.beginPath();
        ctx.rect(offsetX, 0, VIEW_W, VIEW_H);
        ctx.clip();

        // Living ambient (never pure black)
        ctx.fillStyle = fogForWarrior ? th.fog : th.ambient;
        ctx.fillRect(offsetX, 0, VIEW_W, VIEW_H);

        ctx.translate(offsetX - cam.x, -cam.y);
        this.map.drawFloor(ctx, cam, VIEW_W, VIEW_H);
        this.map.drawDecor(ctx, onlyRevealed, this.time);
        this.map.drawWalls(ctx, onlyRevealed);
        if (showLight) this.player1.drawLightCone(ctx);
        for (const enemy of this.enemies) enemy.draw(ctx, this.time);
        this.player1.draw(ctx, this.time);
        this.player2.draw(ctx, this.time);
        ctx.restore();

        // Soft vignette (green/pink, not black)
        ctx.save();
        ctx.beginPath();
        ctx.rect(offsetX, 0, VIEW_W, VIEW_H);
        ctx.clip();
        const vig = ctx.createRadialGradient(
          offsetX + VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.2,
          offsetX + VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.8
        );
        vig.addColorStop(0, "rgba(0,0,0,0)");
        vig.addColorStop(1, fogForWarrior ? "rgba(30,50,40,0.45)" : "rgba(60,100,70,0.2)");
        ctx.fillStyle = vig;
        ctx.fillRect(offsetX, 0, VIEW_W, VIEW_H);
        ctx.restore();
      }

      _drawUI() {
        const ctx = this.ctx;
        const th = this.map.theme;
        const hud = ctx.createLinearGradient(0, 0, 0, 50);
        hud.addColorStop(0, "rgba(255, 255, 255, 0.55)");
        hud.addColorStop(1, "rgba(200, 240, 200, 0.15)");
        ctx.fillStyle = hud;
        ctx.fillRect(0, 0, CANVAS_W, 50);

        ctx.font = "700 15px Cormorant Garamond, serif";
        ctx.fillStyle = "#c05090";
        ctx.fillText("Our Light", 16, 30);

        const barX = 130, barY = 16, barW = 280, barH = 16;
        const hpRatio = this.sharedHp / SHARED_MAX_HP;
        roundRect(ctx, barX, barY, barW, barH, 8);
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fill();
        roundRect(ctx, barX, barY, barW * hpRatio, barH, 8);
        ctx.fillStyle = hpRatio > 0.35 ? "#ff8ec8" : "#ff4a7a";
        ctx.fill();
        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = "#5a3860";
        ctx.fillText(`HP ${Math.ceil(this.sharedHp)}`, barX + 10, barY + 12);

        ctx.fillStyle = "#4a7860";
        ctx.fillText(`Stage ${this.stageIndex + 1}/3 · ${th.name}`, 440, 30);
        ctx.fillStyle = "#8050a0";
        ctx.fillText(`Ghosts ${this.enemiesDefeated}/${this.totalEnemies}`, 720, 30);

        // Pad status
        ctx.fillStyle = this.padsConnected > 0 ? "#408060" : "#906080";
        ctx.font = "600 10px Quicksand, sans-serif";
        ctx.fillText(
          this.padsConnected > 0
            ? `Controller${this.padsConnected > 1 ? "s" : ""}: ${this.padsConnected}`
            : "No controller",
          880, 30
        );
      }

      _drawPhaseBanner() {
        const ctx = this.ctx;
        const th = STAGES[this.stageIndex];
        const a = Math.min(1, this.phaseAnnounce);
        ctx.save();
        ctx.globalAlpha = Math.min(1, a * 1.2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        ctx.fillRect(200, 220, 600, 100);
        ctx.strokeStyle = "rgba(200, 100, 150, 0.5)";
        ctx.lineWidth = 3;
        ctx.strokeRect(200, 220, 600, 100);
        ctx.textAlign = "center";
        ctx.font = "700 28px Cormorant Garamond, serif";
        ctx.fillStyle = "#c05090";
        ctx.fillText(`Stage ${th.id} — ${th.name}`, CANVAS_W / 2, 268);
        ctx.font = "600 14px Quicksand, sans-serif";
        ctx.fillStyle = "#5a7860";
        ctx.fillText(th.subtitle, CANVAS_W / 2, 298);
        ctx.textAlign = "left";
        ctx.restore();
      }

      _drawStageClear() {
        const ctx = this.ctx;
        ctx.textAlign = "center";
        ctx.font = "700 22px Quicksand, sans-serif";
        ctx.fillStyle = "#408060";
        const msg = this.stageIndex >= STAGES.length - 1
          ? "Forest saved…"
          : "Path opens… next grove!";
        ctx.fillText(msg, CANVAS_W / 2, CANVAS_H / 2);
        ctx.textAlign = "left";
      }

      _drawGameOver() {
        const ctx = this.ctx;
        ctx.fillStyle = "rgba(80, 40, 60, 0.55)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.textAlign = "center";
        ctx.font = "700 42px Cormorant Garamond, serif";
        ctx.fillStyle = "#ff8ab8";
        ctx.fillText("Game Over", CANVAS_W / 2, CANVAS_H / 2 - 10);
        ctx.font = "600 16px Quicksand, sans-serif";
        ctx.fillStyle = "#fff0f8";
        ctx.fillText("Press R to return to character select", CANVAS_W / 2, CANVAS_H / 2 + 30);
        ctx.textAlign = "left";
      }

      _drawVictory() {
        const ctx = this.ctx;
        ctx.fillStyle = "rgba(180, 230, 190, 0.7)";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.textAlign = "center";
        ctx.font = "700 44px Cormorant Garamond, serif";
        ctx.fillStyle = "#c05090";
        ctx.fillText("Our Light shines!", CANVAS_W / 2, CANVAS_H / 2 - 16);
        ctx.font = "600 16px Quicksand, sans-serif";
        ctx.fillStyle = "#406850";
        ctx.fillText("All three groves are safe — R for new heroes", CANVAS_W / 2, CANVAS_H / 2 + 28);
        ctx.textAlign = "left";
      }

      _drawSelectScreen() {
        const ctx = this.ctx;

        // Fundo suave (mint → rosa)
        const bg = ctx.createLinearGradient(0, 0, CANVAS_W, CANVAS_H);
        bg.addColorStop(0, "#c8ecc8");
        bg.addColorStop(0.45, "#e8f8e0");
        bg.addColorStop(1, "#f8d0e8");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Faixa de grama soft-pixel
        for (let x = 0; x < CANVAS_W; x += 16) {
          ctx.fillStyle = x % 32 === 0 ? "#90d890" : "#a8e0a0";
          ctx.fillRect(x, CANVAS_H - 36, 16, 36);
          ctx.fillStyle = "#78c878";
          ctx.fillRect(x + 4, CANVAS_H - 44, 8, 10);
        }

        // Partículas leves (só no topo, longe dos cards)
        for (let i = 0; i < 14; i++) {
          const px = (i * 97 + this.time * 25) % (CANVAS_W + 20) - 10;
          const py = 18 + (i * 29 + Math.sin(this.time + i) * 10) % 50;
          ctx.fillStyle = i % 2 ? "rgba(255,180,210,0.35)" : "rgba(140,200,150,0.35)";
          ctx.fillRect(pix(px), pix(py), 4, 4);
        }

        // ── Título ──
        ctx.textAlign = "center";
        ctx.font = "700 30px Cormorant Garamond, serif";
        ctx.fillStyle = "#b86890";
        ctx.fillText("Our Light", CANVAS_W / 2, 34);

        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = "#6a8078";
        ctx.fillText("Choose your heroes · 3 magical stages", CANVAS_W / 2, 54);

        // ── Painel de instruções (mais alto, sem overlap) ──
        roundRect(ctx, 48, 64, 904, 58, 14);
        ctx.fillStyle = "rgba(255, 255, 255, 0.62)";
        ctx.fill();
        ctx.strokeStyle = "rgba(150, 190, 160, 0.45)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, 48, 64, 904, 58, 14);
        ctx.stroke();

        // Três colunas claras
        const colY = 78;
        const cols = [
          {
            x: 200,
            title: "P1 · Light",
            titleColor: "#6a8ec8",
            line: "A / D  choose   ·   W  ready",
          },
          {
            x: 500,
            title: "P2 · Sword",
            titleColor: "#c87898",
            line: "← / →  choose   ·   Space  ready",
          },
          {
            x: 800,
            title: this.padsConnected > 0 ? `Pads · ${this.padsConnected}` : "Controller",
            titleColor: this.padsConnected > 0 ? "#5a9a78" : "#8a7a90",
            line: this.padsConnected > 0
              ? "Stick move  ·  A ready  ·  Start"
              : "Pair Bluetooth, then press a button",
          },
        ];

        for (const col of cols) {
          ctx.font = "700 12px Quicksand, sans-serif";
          ctx.fillStyle = col.titleColor;
          ctx.fillText(col.title, col.x, colY);
          ctx.font = "500 11px Quicksand, sans-serif";
          ctx.fillStyle = "#5e6e68";
          ctx.fillText(col.line, col.x, colY + 20);
        }

        ctx.font = "600 10px Quicksand, sans-serif";
        ctx.fillStyle = "#7a8a82";
        ctx.fillText("When both are ready → Enter or click the button below", CANVAS_W / 2, 114);

        // ── Status P1 / P2 (pills separados, sem sobrepor) ──
        this._drawReadyPill(
          ctx, 220, 130, 200, 28,
          `P1  ${CHARACTERS[CHAR_ORDER[this.selectP1]].name}`,
          this.readyP1, "#7a9fd0", "#e8f0fa"
        );
        this._drawReadyPill(
          ctx, 580, 130, 200, 28,
          `P2  ${CHARACTERS[CHAR_ORDER[this.selectP2]].name}`,
          this.readyP2, "#d088a8", "#faeef4"
        );

        // ── Cards ──
        const cards = this._selectCardLayout();
        for (let i = 0; i < cards.length; i++) this._drawCharCard(ctx, cards[i], i);

        // ── Botão Start ──
        const btn = this._startButtonRect();
        const canStart = this.readyP1 && this.readyP2;
        roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 23);
        const btnG = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
        if (canStart) {
          btnG.addColorStop(0, "#e8a0c0");
          btnG.addColorStop(1, "#c878a0");
        } else {
          btnG.addColorStop(0, "#d0dcd0");
          btnG.addColorStop(1, "#b8c8b8");
        }
        ctx.fillStyle = btnG;
        ctx.fill();
        ctx.strokeStyle = canStart ? "rgba(255,255,255,0.55)" : "rgba(100,120,100,0.15)";
        ctx.lineWidth = 2;
        roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 23);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "700 15px Quicksand, sans-serif";
        ctx.fillStyle = canStart ? "#fffafc" : "#6a7a6a";
        ctx.fillText(
          canStart ? "Hear the tale ✦" : "Waiting for both players…",
          btn.x + btn.w / 2,
          btn.y + btn.h / 2
        );
        ctx.textBaseline = "alphabetic";

        ctx.font = "600 10px Quicksand, sans-serif";
        ctx.fillStyle = "#7a9080";
        ctx.fillText("Bloom Grove  →  Emerald Path  →  Rose Dusk", CANVAS_W / 2, 498);

        ctx.textAlign = "left";
      }

      /** Pill de status do jogador na seleção */
      _drawReadyPill(ctx, x, y, w, h, label, ready, accent, fill) {
        roundRect(ctx, x, y, w, h, h / 2);
        ctx.fillStyle = ready ? "rgba(180, 220, 190, 0.85)" : fill;
        ctx.fill();
        ctx.strokeStyle = ready ? "#6aaa80" : accent;
        ctx.lineWidth = 1.5;
        roundRect(ctx, x, y, w, h, h / 2);
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "700 12px Quicksand, sans-serif";
        ctx.fillStyle = ready ? "#3a7050" : "#6a5868";
        ctx.fillText(ready ? `${label}  ✓ ready` : `${label}  ·  confirm`, x + w / 2, y + h / 2);
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
      }

      _drawCharCard(ctx, card, index) {
        const char = CHARACTERS[card.id];
        const selectedByP1 = this.selectP1 === index;
        const selectedByP2 = this.selectP2 === index;

        roundRect(ctx, card.x, card.y, card.w, card.h, 16);
        const cg = ctx.createLinearGradient(card.x, card.y, card.x, card.y + card.h);
        cg.addColorStop(0, "rgba(255,255,255,0.75)");
        cg.addColorStop(1, "rgba(220, 245, 220, 0.9)");
        ctx.fillStyle = cg;
        ctx.fill();

        ctx.lineWidth = selectedByP1 || selectedByP2 ? 3 : 1.5;
        ctx.strokeStyle = selectedByP1 && selectedByP2 ? "#e8c060"
          : selectedByP1 ? "#6090ff"
          : selectedByP2 ? "#ff7090"
          : "rgba(120, 180, 130, 0.45)";
        roundRect(ctx, card.x, card.y, card.w, card.h, 16);
        ctx.stroke();

        if (selectedByP1) {
          ctx.fillStyle = "#5a8fff";
          roundRect(ctx, card.x + 10, card.y + 10, 36, 20, 8);
          ctx.fill();
          ctx.font = "700 11px Quicksand, sans-serif";
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.fillText("P1", card.x + 28, card.y + 24);
        }
        if (selectedByP2) {
          ctx.fillStyle = "#ff6a8a";
          roundRect(ctx, card.x + card.w - 46, card.y + 10, 36, 20, 8);
          ctx.fill();
          ctx.font = "700 11px Quicksand, sans-serif";
          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.fillText("P2", card.x + card.w - 28, card.y + 24);
        }

        CharacterArt.draw(
          ctx, card.id,
          card.x + card.w / 2, card.y + 108,
          2.05,
          Math.sin(this.time * 1.2 + index) * 0.35,
          this.time, false, 0
        );

        ctx.textAlign = "center";
        ctx.font = "700 17px Cormorant Garamond, serif";
        ctx.fillStyle = "#7a5868";
        ctx.fillText(char.name, card.x + card.w / 2, card.y + 185);
        ctx.font = "600 11px Quicksand, sans-serif";
        ctx.fillStyle = "#9a7890";
        ctx.fillText(char.title, card.x + card.w / 2, card.y + 202);
        ctx.font = "500 10px Quicksand, sans-serif";
        ctx.fillStyle = "rgba(90, 100, 95, 0.72)";
        this._wrapText(ctx, char.blurb, card.x + card.w / 2, card.y + 220, card.w - 22, 12);
        ctx.textAlign = "left";
      }

      _wrapText(ctx, text, x, y, maxW, lineH) {
        const words = text.split(" ");
        let line = "", yy = y;
        for (const w of words) {
          const test = line + w + " ";
          if (ctx.measureText(test).width > maxW) {
            ctx.fillText(line, x, yy);
            line = w + " ";
            yy += lineH;
          } else line = test;
        }
        ctx.fillText(line, x, yy);
      }

      /** Quebra de linha alinhada à esquerda (intro) */
      _wrapTextLeft(ctx, text, x, y, maxW, lineH) {
        ctx.textAlign = "left";
        const words = text.split(" ");
        let line = "", yy = y;
        for (const w of words) {
          const test = line + w + " ";
          if (ctx.measureText(test).width > maxW && line.length > 0) {
            ctx.fillText(line.trim(), x, yy);
            line = w + " ";
            yy += lineH;
          } else {
            line = test;
          }
        }
        if (line.trim()) ctx.fillText(line.trim(), x, yy);
      }

      loop(now) {
        const dt = Math.min(0.05, (now - this._lastTime) / 1000);
        this._lastTime = now;
        this.update(dt);
        this.draw();
        requestAnimationFrame(this.loop);
      }

      start() {
        this._lastTime = performance.now();
        requestAnimationFrame(this.loop);
      }
    }

    const game = new Game(document.getElementById("game"));
    game.start();
  </script>
</body>
